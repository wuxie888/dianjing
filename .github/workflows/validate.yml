name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audit script tests
        run: python3 -m unittest discover -s skills/repo-atelier/scripts -p 'test_*.py'
      - name: Audit this repository
        run: python3 skills/repo-atelier/scripts/audit_repository.py .
